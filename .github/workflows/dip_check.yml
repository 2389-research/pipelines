name: dip check

# Repo-wide structural gate: every .dip in the repo must parse + validate under
# the pinned dippin. Until this existed, only dev_loop/dev_loop.dip was gated
# (dev_loop_smoke.yml) — the other ~57 pipelines were unguarded, which is how the
# toolchain pin silently drifted ~15 releases stale. `dippin check` covers parse
# errors, structural validation, and error-severity lint (DIP155–DIP158). It does
# NOT enforce formatting: `dippin fmt` is not comment-preserving yet
# (dippin-lang#259), so a `fmt --check` gate would force authors to run a
# formatter that erases the repo's `# ABOUTME:` / provider-dependency headers.
# Add fmt enforcement once dippin-lang#259 lands.

on:
  pull_request:
    paths:
      - "**/*.dip"
      - ".github/workflows/dip_check.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.dip"
      - ".github/workflows/dip_check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Satisfy the pinned dippin module's go directive (dippin v0.72.0 → go
          # 1.25.4). setup-go with "1.25" resolves to the newest 1.25.x.
          go-version: "1.25"

      - name: Install dippin (pinned — keep in lockstep with dev_loop_smoke.yml)
        env:
          # MUST match dev_loop_smoke.yml's DIPPIN_VERSION so every gate validates
          # against the same language semantics. tracker v0.73.1 vendors dippin
          # v0.72.0; bump both workflows together.
          DIPPIN_VERSION: v0.72.0
        run: |
          go install "github.com/2389-research/dippin-lang/cmd/dippin@${DIPPIN_VERSION}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Print dippin version
        run: dippin version

      - name: dippin check — every .dip must parse + validate
        run: |
          set -uo pipefail
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! out=$(dippin check "$f" 2>&1); then
              echo "::error file=${f}::dippin check failed"
              printf '%s\n' "$out"
              fail=1
            fi
          done < <(find . -type f -name '*.dip' -not -path './.git/*' | sort)
          echo "Checked ${count} .dip file(s)."
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more .dip files failed 'dippin check'. Fix them (or run 'dippin check <file>' locally to reproduce)."
            exit 1
          fi
          echo "All ${count} .dip files pass 'dippin check'."
